[project]
name = "clubsp"
version = "0.1.0"
description = "ClubSP Wholesale Autopilot core"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
integrations = ["httpx>=0.28.1,<1", "pydantic>=2.13.5,<3", "rapidfuzz>=3.14.6,<4"]
scale = ["SQLAlchemy>=2.1.3,<3", "alembic>=1.20,<2", "rq>=2.12,<3", "redis>=8.1,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.setuptools.package-data]
app = ["static/*"]
