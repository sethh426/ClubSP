[project]
name = "clubsp"
version = "0.1.0"
description = "ClubSP Wholesale Autopilot core"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.setuptools.package-data]
app = ["static/*"]
