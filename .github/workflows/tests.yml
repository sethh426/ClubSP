name: App tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: app-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          retention-days: 2
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: npm install --no-save @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node --check app/static/app.js
      - run: node --check app/static/login.js
      - run: node --check app/static/workspace.js
      - run: node --check app/static/sourcing.js
      - run: node --check app/static/commitment.js
      - run: node --check app/static/communications.js
      - run: node --check app/static/knowledge.js
      - run: node --check app/static/gmail.js
      - run: node --check app/static/command.js
      - run: node --check app/static/funding.js
      - run: node --check app/static/relationships.js
      - run: npx playwright test
      - run: npx playwright test -c playwright.funding.config.js
      - run: npx playwright test -c playwright.economics.config.js
      - run: npx playwright test -c playwright.relationships.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
  meta-live:
    if: github.head_ref == 'sentras-foundation-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check live public catalogs and ArcGIS schema
        run: python -m app.meta_sentry_check --live
